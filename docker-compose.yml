version: '3.8'

services:

  kong:
    image: kong:3.6
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PLUGINS: bundled,prometheus
    volumes:
      - ./kong.yml:/kong.yml
    ports:
      - "8000:8000"
      - "8001:8001"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  auth-db:
    image: postgres:15
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-exporter-auth:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@auth-db:5432/auth_db?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@auth-db:5432/auth_db
      REDIS_HOST: redis
      REDIS_PORT: 6379

  paciente-db:
    image: postgres:15
    environment:
      POSTGRES_DB: paciente_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - paciente_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d paciente_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-exporter-paciente:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@paciente-db:5432/paciente_db?sslmode=disable"
    ports:
      - "9188:9187"
    depends_on:
      paciente-db:
        condition: service_healthy
    restart: unless-stopped

  paciente-service:
    build: ./paciente-service
    depends_on:
      paciente-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@paciente-db:5432/paciente_db
      REDIS_HOST: redis
      REDIS_PORT: 6379

  profissionais-db:
    image: postgres:15
    environment:
      POSTGRES_DB: profissionais_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - profissionais_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d profissionais_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-exporter-profissionais:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@profissionais-db:5432/profissionais_db?sslmode=disable"
    ports:
      - "9189:9187"
    depends_on:
      profissionais-db:
        condition: service_healthy
    restart: unless-stopped

  profissionais-service:
    build: ./profissionais-service
    depends_on:
      profissionais-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@profissionais-db:5432/profissionais_db
      REDIS_HOST: redis
      REDIS_PORT: 6379


  agendamento-db:
    image: postgres:15
    environment:
      POSTGRES_DB: agendamento_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - agendamento_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d agendamento_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-exporter-agendamento:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@agendamento-db:5432/agendamento_db?sslmode=disable"
    ports:
      - "9190:9187"
    depends_on:
      agendamento-db:
        condition: service_healthy
    restart: unless-stopped

  agendamento-service:
    build: ./agendamento-service
    depends_on:
      agendamento-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@agendamento-db:5432/agendamento_db
      REDIS_HOST: redis
      REDIS_PORT: 6379

  notificacao-db:
    image: postgres:15
    environment:
      POSTGRES_DB: notificacao_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - notificacao_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d notificacao_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-exporter-notificacao:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@notificacao-db:5432/notificacao_db?sslmode=disable"
    ports:
      - "9191:9187"
    depends_on:
      notificacao-db:
        condition: service_healthy
    restart: unless-stopped

  notificacao-service:
    build: ./notificacao-service
    depends_on:
      notificacao-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@notificacao-db:5432/notificacao_db
      REDIS_HOST: redis
      REDIS_PORT: 6379


  pagamento-db:
    image: postgres:15
    environment:
      POSTGRES_DB: pagamento_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5437:5432"
    volumes:
      - pagamento_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d pagamento_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-exporter-pagamento:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pagamento-db:5432/pagamento_db?sslmode=disable"
    ports:
      - "9192:9187"
    depends_on:
      pagamento-db:
        condition: service_healthy
    restart: unless-stopped

  pagamento-service:
    build: ./pagamento-service
    depends_on:
      pagamento-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pagamento-db:5432/pagamento_db
      REDIS_HOST: redis
      REDIS_PORT: 6379

  

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: localhost
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  default:
    name: microservices-network

volumes:
  auth_data:
  paciente_data:
  profissionais_data:
  agendamento_data:
  notificacao_data:
  pagamento_data:
  redis_data:
  prometheus_data:
  grafana_data: